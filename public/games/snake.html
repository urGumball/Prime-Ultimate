<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake 4S</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <style>
        * { -webkit-box-sizing: border-box; box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000 url('https://www.transparenttextures.com/patterns/dark-denim-3.png') repeat; color: #fff; font-family: "Helvetica Neue", sans-serif; padding: 8px; -webkit-user-select: none; }
        .header { background: -webkit-gradient(linear, left top, left bottom, from(#b0b9c6), to(#4d5c71)); padding: 6px; border-radius: 6px 6px 0 0; text-align: center; margin-bottom: 8px; }
        .header h1 { font-size: 14px; text-shadow: 0 -1px 0 #222; }
        .arcade-cabinet { background: -webkit-gradient(linear, left top, left bottom, from(#3a4556), to(#1e242e)); border: 1px solid #4a5669; border-radius: 8px; padding: 6px; max-width: 300px; margin: 0 auto; text-align: center; }
        canvas { display: block; margin: 0 auto; background: #000; border-radius: 4px; border: 2px solid #333; }
        .pad-btn { display: inline-block; width: 44px; height: 36px; line-height: 36px; font-size: 14px; font-weight: bold; color: #fff; background: -webkit-gradient(linear, left top, left bottom, from(#6d7d93), to(#2d3644)); border: 1px solid #1f2530; border-radius: 4px; margin: 2px; }
        .btn-back { display: inline-block; margin-top: 8px; padding: 6px 14px; font-size: 11px; font-weight: bold; color: #fff; background: -webkit-gradient(linear, left top, left bottom, from(#6d7d93), to(#2d3644)); border: 1px solid #1f2530; border-radius: 4px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="header"><h1>Snake 4S</h1></div>

    <div class="arcade-cabinet">
        <canvas id="snakeCanvas" width="260" height="260"></canvas>

        <div style="margin-top:8px;">
            <div class="pad-btn" onclick="setDir(0, -1)">▲</div><br>
            <div class="pad-btn" onclick="setDir(-1, 0)">◄</div>
            <div class="pad-btn" onclick="setDir(0, 1)">▼</div>
            <div class="pad-btn" onclick="setDir(1, 0)">►</div>
        </div>

        <a href="../games.html" class="btn-back">◄ Back to Menu</a>
    </div>

    <script>
        var canvas = document.getElementById('snakeCanvas');
        var ctx = canvas.getContext('2d');

        var gridSize = 13;
        var cols = canvas.width / gridSize;
        var rows = canvas.height / gridSize;

        var snake = [{x: 5, y: 5}];
        var dirX = 1, dirY = 0;
        var food = {x: 12, y: 12};
        var score = 0;

        function update() {
            var head = {x: snake[0].x + dirX, y: snake[0].y + dirY};

            if (head.x < 0) head.x = cols - 1;
            if (head.x >= cols) head.x = 0;
            if (head.y < 0) head.y = rows - 1;
            if (head.y >= rows) head.y = 0;

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                food = {
                    x: Math.floor(Math.random() * cols),
                    y: Math.floor(Math.random() * rows)
                };
            } else {
                snake.pop();
            }

            snake.unshift(head);
        }

        function draw() {
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Food
            ctx.fillStyle = "#ffcc00";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 1, gridSize - 1);

            // Snake
            ctx.fillStyle = "#00cc00";
            for (var i = 0; i < snake.length; i++) {
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 1, gridSize - 1);
            }

            // Score
            ctx.fillStyle = "#888888";
            ctx.font = "12px Helvetica";
            ctx.fillText("Score: " + score, 8, 16);
        }

        function setDir(x, y) {
            if (x !== 0 && dirX !== 0) return;
            if (y !== 0 && dirY !== 0) return;
            dirX = x;
            dirY = y;
        }

        window.addEventListener('keydown', function(e) {
            if (e.keyCode === 37) setDir(-1, 0);
            if (e.keyCode === 38) setDir(0, -1);
            if (e.keyCode === 39) setDir(1, 0);
            if (e.keyCode === 40) setDir(0, 1);
        });

        setInterval(function() { update(); draw(); }, 120);
    </script>
</body>
</html>
