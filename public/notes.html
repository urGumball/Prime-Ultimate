<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" href="/favicon.png" type="image/png">
    <title>Notes</title>
    <style>
        * { -webkit-box-sizing: border-box; box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #fdf6d8 url('https://www.transparenttextures.com/patterns/lined-paper.png') repeat;
            color: #1a1a1a;
            font-family: "Marker Felt", "Comic Sans MS", sans-serif;
            padding: 10px;
        }

        /* iOS 5 Header Bar */
        .header {
            background: -webkit-gradient(linear, left top, left bottom, from(#b0b9c6), color-stop(0.05, #8e9cb0), color-stop(0.5, #6d7d93), color-stop(0.51, #57677d), to(#4d5c71));
            border-bottom: 1px solid #2e3540;
            padding: 8px 10px;
            border-radius: 6px 6px 0 0;
            margin-bottom: 10px;
        }
        .header h1 { font-size: 16px; text-shadow: 0 -1px 0 #222; text-align: center; color: #fff; font-family: "Helvetica Neue", sans-serif; }

        /* Glossy Controls */
        .btn-ios {
            display: inline-block;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 -1px 0 #000;
            background: -webkit-gradient(linear, left top, left bottom, from(#6d7d93), color-stop(0.5, #4c586c), color-stop(0.51, #3b4657), to(#2d3644));
            border: 1px solid #1f2530;
            border-radius: 4px;
            cursor: pointer;
            font-family: "Helvetica Neue", sans-serif;
        }

        .note-input {
            width: 100%;
            height: 180px;
            background: transparent;
            border: none;
            font-family: "Marker Felt", sans-serif;
            font-size: 16px;
            line-height: 24px;
            outline: none;
            resize: none;
        }

        .notes-list {
            background: #fff;
            border-radius: 6px;
            border: 1px solid #c0b080;
            margin-top: 10px;
            overflow: hidden;
            font-family: "Helvetica Neue", sans-serif;
        }
        .note-item {
            padding: 8px 10px;
            border-bottom: 1px solid #e0d0a0;
            font-size: 12px;
            color: #333;
            cursor: pointer;
        }
        .note-item:last-child { border-bottom: none; }
        .note-item:active { background: #0275d8; color: #fff; }
        .del-btn { float: right; color: #cc0000; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>iOS 5 Notepad</h1>
    </div>

    <!-- Active Textarea -->
    <textarea id="notePad" class="note-input" placeholder="Type a new note here..."></textarea>
    
    <div style="text-align: right; margin-top: 5px;">
        <button class="btn-ios" onclick="saveCurrentNote()">Save Note</button>
    </div>

    <!-- Saved Notes Container -->
    <div style="font-family:'Helvetica Neue',sans-serif; font-size:12px; font-weight:bold; margin-top:15px; color:#554;">Saved Notes:</div>
    <div class="notes-list" id="notesContainer"></div>

    <script>
        var pad = document.getElementById('notePad');

        function getNotes() {
            try {
                return JSON.parse(localStorage.getItem('4s_notes_list')) || [];
            } catch(e) {
                return [];
            }
        }

        function saveNotes(list) {
            try {
                localStorage.setItem('4s_notes_list', JSON.stringify(list));
            } catch(e) {}
        }

        function saveCurrentNote() {
            var text = pad.value;
            if (!text) return;

            var list = getNotes();
            list.unshift({
                id: Date.now(),
                text: text,
                date: new Date().toLocaleDateString()
            });

            saveNotes(list);
            pad.value = '';
            renderNotes();
        }

        function deleteNote(id, e) {
            if (e && e.stopPropagation) e.stopPropagation();
            var list = getNotes();
            var newList = [];
            for (var i = 0; i < list.length; i++) {
                if (list[i].id !== id) newList.push(list[i]);
            }
            saveNotes(newList);
            renderNotes();
        }

        function loadNote(text) {
            pad.value = text;
            window.scrollTo(0, 0);
        }

        function renderNotes() {
            var container = document.getElementById('notesContainer');
            var list = getNotes();
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = '<div class="note-item" style="color:#888;">No saved notes yet.</div>';
                return;
            }

            for (var i = 0; i < list.length; i++) {
                var item = list[i];
                var div = document.createElement('div');
                div.className = 'note-item';
                div.onclick = (function(txt) {
                    return function() { loadNote(txt); };
                })(item.text);

                var preview = item.text.length > 30 ? item.text.substring(0, 30) + '...' : item.text;

                div.innerHTML = 
                    '<span>' + preview + '</span>' +
                    '<span class="del-btn" onclick="deleteNote(' + item.id + ', event)">✕</span>';

                container.appendChild(div);
            }
        }

        window.onload = renderNotes;
    </script>
</body>
</html>
