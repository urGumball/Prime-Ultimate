<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="/favicon.png" type="image/png">
    <title>Chat Studio</title>
    <style>
        * { -webkit-box-sizing: border-box; box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #000 url('https://www.transparenttextures.com/patterns/dark-denim-3.png') repeat; 
            color: #fff; 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
            padding: 8px; 
            -webkit-user-select: none;
        }

        .header {
            background: -webkit-gradient(linear, left top, left bottom, from(#5865F2), to(#3b47c6));
            border-bottom: 1px solid #2b3294;
            padding: 8px;
            border-radius: 6px 6px 0 0;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 0 -1px 0 #222;
            margin-bottom: 8px;
        }

        .server-bar {
            display: -webkit-box;
            margin-bottom: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .server-icon {
            width: 38px;
            height: 38px;
            background: #333;
            border-radius: 10px;
            line-height: 38px;
            text-align: center;
            margin-right: 6px;
            font-weight: bold;
            font-size: 12px;
            border: 1px solid #555;
            cursor: pointer;
            color: #aaa;
        }
        .server-icon.active {
            border-color: #5865F2;
            background: #5865F2;
            color: #fff;
            -webkit-box-shadow: 0 0 6px rgba(88,101,242,0.8);
        }

        .chat-box {
            background: #fff;
            color: #000;
            border-radius: 6px;
            height: 240px;
            padding: 8px;
            overflow-y: auto;
            font-size: 12px;
            margin-bottom: 8px;
            border: 1px solid #999;
        }
        .msg-line { margin-bottom: 6px; line-height: 1.3; }
        .msg-user { font-weight: bold; color: #5865F2; margin-right: 4px; }
        .msg-time { font-size: 9px; color: #888; margin-left: 4px; }

        .input-bar { display: -webkit-box; margin-bottom: 8px; }
        .msg-input {
            -webkit-box-flex: 1;
            padding: 8px;
            font-size: 12px;
            border: 1px solid #444;
            border-radius: 4px 0 0 4px;
            outline: none;
        }
        .btn-send {
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            background: -webkit-gradient(linear, left top, left bottom, from(#5865F2), to(#3b47c6));
            border: 1px solid #2b3294;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }

        .btn-ios {
            display: inline-block;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            background: -webkit-gradient(linear, left top, left bottom, from(#6d7d93), to(#2d3644));
            border: 1px solid #1f2530;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            margin-right: 4px;
        }
    </style>
</head>
<body>

    <div class="header">Discord Chat 4S</div>

    <!-- Server selector icons -->
    <div class="server-bar" id="serverList"></div>

    <!-- Message Window -->
    <div class="chat-box" id="chatBox"></div>

    <!-- Message Entry -->
    <form class="input-bar" onsubmit="sendMessage(event)">
        <input type="text" id="msgInput" class="msg-input" placeholder="Send a message..." required>
        <button type="submit" class="btn-send">Send</button>
    </form>

    <button class="btn-ios" onclick="addServer()">+ Add Server</button>
    <a href="index.html" class="btn-ios" style="float:right;">Home</a>

    <script>
        var servers = [
            { id: 's1', name: 'General', icon: 'GEN' },
            { id: 's2', name: 'Gaming', icon: 'GAM' }
        ];
        var activeServerIndex = 0;

        function loadMessages(serverId) {
            try {
                var data = localStorage.getItem('4s_chat_' + serverId);
                return data ? JSON.parse(data) : [
                    { user: 'System', text: 'Welcome to #' + servers[activeServerIndex].name + ' channel!', time: '12:00 PM' }
                ];
            } catch(e) {
                return [];
            }
        }

        function saveMessages(serverId, msgs) {
            try {
                localStorage.setItem('4s_chat_' + serverId, JSON.stringify(msgs));
            } catch(e) {}
        }

        function renderServers() {
            var bar = document.getElementById('serverList');
            bar.innerHTML = '';
            for (var i = 0; i < servers.length; i++) {
                var btn = document.createElement('div');
                btn.className = 'server-icon' + (i === activeServerIndex ? ' active' : '');
                btn.innerText = servers[i].icon;
                btn.onclick = (function(idx) { return function() { switchServer(idx); }; })(i);
                bar.appendChild(btn);
            }
        }

        function renderChat() {
            var box = document.getElementById('chatBox');
            box.innerHTML = '';
            var msgs = loadMessages(servers[activeServerIndex].id);

            for (var i = 0; i < msgs.length; i++) {
                var m = msgs[i];
                var div = document.createElement('div');
                div.className = 'msg-line';
                div.innerHTML = '<span class="msg-user">' + m.user + ':</span>' + m.text + '<span class="msg-time">' + m.time + '</span>';
                box.appendChild(div);
            }
            box.scrollTop = box.scrollHeight;
        }

        function switchServer(idx) {
            activeServerIndex = idx;
            renderServers();
            renderChat();
        }

        function sendMessage(e) {
            if (e && e.preventDefault) e.preventDefault();
            var input = document.getElementById('msgInput');
            var text = input.value.trim();
            if (!text) return;

            var msgs = loadMessages(servers[activeServerIndex].id);
            var now = new Date();
            var timeStr = now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();

            msgs.push({ user: 'You', text: text, time: timeStr });
            saveMessages(servers[activeServerIndex].id, msgs);

            input.value = '';
            renderChat();
        }

        function addServer() {
            var sName = prompt("Enter new Server / Channel Name:");
            if (sName) {
                var id = 's_' + Date.now();
                var icon = sName.substring(0, 3).toUpperCase();
                servers.push({ id: id, name: sName, icon: icon });
                switchServer(servers.length - 1);
            }
        }

        window.onload = function() {
            renderServers();
            renderChat();
        };
    </script>
</body>
</html>
