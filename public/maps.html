<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Maps</title>
    <link rel="stylesheet" href="http://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="http://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <link rel="icon" href="/favicon.png" type="image/png">
    <style>
        body, html, #map { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([51.505, -0.09], 13);
        L.tileLayer('http://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        map.locate({setView: true, maxZoom: 15});
        map.on('locationfound', function(e) {
            L.marker(e.latlng).addTo(map).bindPopup("Current Location").openPopup();
        });
    </script>
</body>
</html>
